<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Emerald Tulip for Ninin 💚🌷</title>
    <link rel="stylesheet" href="ninin2.css">
</head>
<body>
    <!-- Video Background - Playsinline for iOS/Android 
    <video autoplay muted loop playsinline webkit-playsinline id="bg-video">
        <source src="assets/polaroid.mp4" type="video/mp4">
    </video>-->
    <div class="overlay"></div>

    <div class="flower-container">
        <div class="tulip-wrapper">
            <!-- Tulip Head with layered petals -->
            <div class="head">
                <div class="petal-back-left"></div>
                <div class="petal-back-right"></div>
                <div class="petal-front-left"></div>
                <div class="petal-front-right"></div>
                <div class="petal-center"></div>
            </div>
            <!-- Stem with leaves -->
            <div class="stem">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
                <div class="leaf leaf-left-lower"></div>
                <div class="leaf leaf-right-lower"></div>
            </div>
        </div>
        
        <h2 class="gift-text">🫶 An Emerald Tulip for Ninin 🫶</h2>
        <a href="ninin1.html" class="back-link">← Back to the Pictures</a>
    </div>

    <script>
        const emojis = ['💚', '🌷', '✨', '💛', '🫶'];
        
        function createTrail(x, y) {
            const trail = document.createElement('div');
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            trail.innerHTML = randomEmoji;
            trail.className = 'heart-trail';
            trail.style.left = x + 'px';
            trail.style.top = y + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 1600);
        }

        // Mouse Support
        document.addEventListener('mousemove', (e) => {
            createTrail(e.pageX, e.pageY);
        });

        // Mobile Touch Support
        document.addEventListener('touchmove', (e) => {
            // Prevents screen scrolling while drawing hearts
            const touch = e.touches[0];
            createTrail(touch.pageX, touch.pageY);
        }, {passive: true});
    </script>
</body>
</html>
