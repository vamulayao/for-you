<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Emerald Tulip for Ninin 💚🌷</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), rgba(46, 204, 113, 0.2));
            z-index: 0;
        }

        .flower-container {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 60px;
        }

        .tulip-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Stem - using transition instead of animation for better PC compatibility */
        .stem {
            width: 10px;
            height: 0px;
            background: linear-gradient(180deg, #3a8a2e, #1e5a18, #2d6b23);
            border-radius: 5px;
            transition: height 3.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        
        /* When page loads, stem grows */
        .stem.grown {
            height: 320px;
        }

        /* Tulip Head */
        .head {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            transform-origin: bottom center;
            transition: transform 2.2s cubic-bezier(0.34, 1.2, 0.64, 1);
            z-index: 2;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.25));
        }
        
        /* When page loads, tulip blooms */
        .head.bloomed {
            transform: translateX(-50%) scale(1);
            bottom: 320px;
        }
        
        /* Sway animation - using JavaScript for better PC compatibility */
        .head.swaying {
            animation: gentleSway 5s ease-in-out infinite;
        }

        @keyframes gentleSway {
            0%, 100% { transform: translateX(-50%) rotate(-2deg); bottom: 320px; }
            50% { transform: translateX(-50%) rotate(2deg); bottom: 320px; }
        }

        /* Emerald Tulip Petals */
        .petal-back-left {
            position: absolute;
            bottom: 0;
            left: -28px;
            width: 55px;
            height: 95px;
            background: linear-gradient(135deg, #2d8f4a, #046307, #1a6b2f);
            border-radius: 100% 0 50% 50%;
            transform: rotate(-20deg);
            transform-origin: bottom center;
            box-shadow: -3px 0 10px rgba(0,0,0,0.2);
        }

        .petal-back-right {
            position: absolute;
            bottom: 0;
            right: -28px;
            width: 55px;
            height: 95px;
            background: linear-gradient(45deg, #2d8f4a, #046307, #1a6b2f);
            border-radius: 0 100% 50% 50%;
            transform: rotate(20deg);
            transform-origin: bottom center;
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
        }

        .petal-front-left {
            position: absolute;
            bottom: 0;
            left: -15px;
            width: 50px;
            height: 85px;
            background: linear-gradient(135deg, #3ca55c, #0e7324, #2a8a42);
            border-radius: 100% 0 50% 50%;
            transform: rotate(-8deg);
            transform-origin: bottom center;
            z-index: 1;
        }

        .petal-front-right {
            position: absolute;
            bottom: 0;
            right: -15px;
            width: 50px;
            height: 85px;
            background: linear-gradient(45deg, #3ca55c, #0e7324, #2a8a42);
            border-radius: 0 100% 50% 50%;
            transform: rotate(8deg);
            transform-origin: bottom center;
            z-index: 1;
        }

        .petal-center {
            position: relative;
            width: 48px;
            height: 88px;
            background: linear-gradient(to bottom, #4db86e, #158b33, #0a5c1f);
            border-radius: 50% 50% 45% 45%;
            box-shadow: inset -3px -5px 12px rgba(0,0,0,0.3), inset 2px 2px 8px rgba(255,255,255,0.2);
            z-index: 2;
        }

        .petal-center::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 18px;
            background: radial-gradient(#F4C542, #D4AF37);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(244,197,66,0.6);
        }

        .petal-center::after {
            content: '✨';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0.8;
        }

        /* Leaves - using transitions */
        .leaf {
            position: absolute;
            width: 55px;
            height: 32px;
            background: linear-gradient(145deg, #3a9a2e, #1e5a18);
            border-radius: 0 100% 0 100%;
            opacity: 0;
            transform: scale(0);
            transition: all 0.9s ease-out;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.2));
        }

        .leaf.visible {
            opacity: 1;
            transform: scale(1);
        }

        .leaf-left {
            left: -45px;
            top: 160px;
            transform: rotate(-35deg) scale(0);
        }
        .leaf-left.visible {
            transform: rotate(-35deg) scale(1);
        }

        .leaf-right {
            right: -45px;
            top: 90px;
            transform: rotate(35deg) scale(0);
        }
        .leaf-right.visible {
            transform: rotate(35deg) scale(1);
        }

        .leaf-left-lower {
            left: -35px;
            top: 240px;
            width: 45px;
            height: 26px;
            transform: rotate(-20deg) scale(0);
            background: linear-gradient(145deg, #2d8522, #165012);
        }
        .leaf-left-lower.visible {
            transform: rotate(-20deg) scale(1);
        }

        .leaf-right-lower {
            right: -35px;
            top: 210px;
            width: 45px;
            height: 26px;
            transform: rotate(25deg) scale(0);
            background: linear-gradient(145deg, #2d8522, #165012);
        }
        .leaf-right-lower.visible {
            transform: rotate(25deg) scale(1);
        }

        /* Text */
        .gift-text {
            color: #F4C542;
            font-family: 'Brush Script MT', 'Segoe UI', cursive;
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            text-shadow: 3px 3px 12px rgba(0,0,0,0.6);
            margin-top: 30px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s ease-out;
            letter-spacing: 1px;
            text-align: center;
        }

        .gift-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .back-link {
            color: rgba(244, 197, 66, 0.8);
            text-decoration: none;
            margin-top: 12px;
            font-size: 0.95rem;
            padding: 6px 18px;
            border-radius: 30px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: white;
            background: rgba(244, 197, 66, 0.4);
            transform: translateY(-2px);
        }

        /* Heart trail */
        .heart-trail {
            position: absolute;
            pointer-events: none;
            font-size: 1.1rem;
            animation: floatUp 1.6s forwards;
            z-index: 100;
            filter: drop-shadow(0 0 4px rgba(255,80,80,0.5));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0.6);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="flower-container">
        <div class="tulip-wrapper">
            <div class="head">
                <div class="petal-back-left"></div>
                <div class="petal-back-right"></div>
                <div class="petal-front-left"></div>
                <div class="petal-front-right"></div>
                <div class="petal-center"></div>
            </div>
            <div class="stem">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
                <div class="leaf leaf-left-lower"></div>
                <div class="leaf leaf-right-lower"></div>
            </div>
        </div>
        
        <h2 class="gift-text">🫶 An Emerald Tulip for Ninin 🫶</h2>
        <a href="ninin1.html" class="back-link">← Back to the Pictures</a>
    </div>

    <script>
        // Force animations using JavaScript for PC compatibility
        setTimeout(() => {
            // Grow stem
            const stem = document.querySelector('.stem');
            stem.classList.add('grown');
            
            // Show leaves with delays
            setTimeout(() => {
                document.querySelector('.leaf-left').classList.add('visible');
            }, 1800);
            
            setTimeout(() => {
                document.querySelector('.leaf-right').classList.add('visible');
            }, 2300);
            
            setTimeout(() => {
                document.querySelector('.leaf-left-lower').classList.add('visible');
            }, 2800);
            
            setTimeout(() => {
                document.querySelector('.leaf-right-lower').classList.add('visible');
            }, 3100);
            
            // Bloom tulip head
            setTimeout(() => {
                const head = document.querySelector('.head');
                head.classList.add('bloomed');
            }, 3000);
            
            // Start swaying after bloom
            setTimeout(() => {
                const head = document.querySelector('.head');
                head.classList.add('swaying');
            }, 5200);
            
            // Show text
            setTimeout(() => {
                document.querySelector('.gift-text').classList.add('visible');
            }, 4500);
            
        }, 100);
        
        // Heart trail
        const emojis = ['💚', '🌷', '✨', '💛', '🫶'];
        
        document.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            trail.innerHTML = randomEmoji;
            trail.className = 'heart-trail';
            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 1600);
        });
        
        console.log('Page loaded - using JavaScript-driven animations for PC compatibility');
    </script>
</body>
</html>
