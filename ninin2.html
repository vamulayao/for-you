<!-- ninin2.html (keeps your video and heart trail) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Flower for Ninin 🌻</title>
    <link rel="stylesheet" href="ninin2.css">
</head>
<body>
    <video autoplay muted loop id="bg-video">
        <source src="assets/polaroid.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="flower-container">
        <div class="sunflower">
            <div class="head">
                <div class="petals-back"></div>
                <div class="petals-front"></div>
                <div class="center">🌻</div>
            </div>
            <div class="stem">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>
        </div>
        
        <!-- Generate sparkles with JS -->
        <h2 class="gift-text">A flower for my Ninin 🌻</h2>
        <a href="ninin.html" class="back-link">← Back to Birthday</a>
    </div>

    <script>
        // Generate sparkles around flower
        function createSparkle() {
            const spark = document.createElement('div');
            spark.className = 'sparkle';
            const flowerRect = document.querySelector('.sunflower').getBoundingClientRect();
            const angle = Math.random() * Math.PI * 2;
            const radius = 150 + Math.random() * 100;
            spark.style.left = (flowerRect.left + flowerRect.width/2 + Math.cos(angle) * radius) + 'px';
            spark.style.top = (flowerRect.top + flowerRect.height/3 + Math.sin(angle) * radius) + 'px';
            spark.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 3000);
        }
        setInterval(createSparkle, 600);

        // Heart trail (your original)
        document.addEventListener('mousemove', (e) => {
            const el = document.createElement('div');
            el.innerHTML = '❤️';
            el.style.position = 'absolute';
            el.style.left = e.pageX + 'px';
            el.style.top = e.pageY + 'px';
            el.style.fontSize = '1.2rem';
            el.style.pointerEvents = 'none';
            el.style.animation = 'riseFade 1.5s forwards';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        });

        // Add keyframe for riseFade if not in CSS (add to CSS if missing)
        const style = document.createElement('style');
        style.textContent = `
            @keyframes riseFade {
                0% { transform: translateY(0) scale(1); opacity: 1; }
                100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
