<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Tulip 💚</title>
    <link rel="stylesheet" href="ninin2.css">
</head>
<body>

    <div class="background"></div>

    <div class="flower-container">

        <div class="tulip-wrapper">

            <!-- Flower Head -->
            <div class="head">
                <div class="petal back-left"></div>
                <div class="petal back-right"></div>

                <div class="petal center"></div>

                <div class="petal front-left"></div>
                <div class="petal front-right"></div>
            </div>

            <!-- Stem -->
            <div class="stem">

                <div class="leaf left"></div>
                <div class="leaf right"></div>

                <div class="leaf lower-left"></div>
                <div class="leaf lower-right"></div>

            </div>
        </div>

        <h1 class="gift-text">🫶 An Emerald Tulip for Ninin 🫶</h1>

        <a href="ninin1.html" class="back-link">
            ← Back to the Pictures
        </a>

    </div>

    <script>
        const emojis = ['💚','✨','🌷','🫶'];

        function spawnEmoji(x, y) {
            const emoji = document.createElement('div');

            emoji.className = 'trail';
            emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left = x + 'px';
            emoji.style.top = y + 'px';

            document.body.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 1500);
        }

        document.addEventListener('mousemove', (e) => {
            spawnEmoji(e.pageX, e.pageY);
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            spawnEmoji(touch.pageX, touch.pageY);
        }, { passive: true });
    </script>

</body>
</html>
