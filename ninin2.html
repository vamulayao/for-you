<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Emerald Tulip for Ninin 💚🌷</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(to top, #0a2a1a, #1a5a2a);
            overflow-x: hidden;
        }

        /* Remove complex overlays for testing */
        .flower-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Simple tulip wrapper */
        .tulip-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        /* Stem - visible immediately */
        .stem {
            width: 12px;
            height: 300px;
            background: linear-gradient(180deg, #3a8a2e, #1e5a18);
            border-radius: 6px;
            position: relative;
        }

        /* Tulip Head - visible immediately */
        .head {
            position: absolute;
            bottom: 300px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Petals - visible immediately with bright colors */
        .petal-back-left {
            position: absolute;
            bottom: 0;
            left: -30px;
            width: 58px;
            height: 98px;
            background: #2d8f4a;
            border-radius: 100% 0 50% 50%;
            transform: rotate(-20deg);
            border: 1px solid #0a5c1f;
        }

        .petal-back-right {
            position: absolute;
            bottom: 0;
            right: -30px;
            width: 58px;
            height: 98px;
            background: #2d8f4a;
            border-radius: 0 100% 50% 50%;
            transform: rotate(20deg);
            border: 1px solid #0a5c1f;
        }

        .petal-front-left {
            position: absolute;
            bottom: 0;
            left: -18px;
            width: 52px;
            height: 88px;
            background: #3ca55c;
            border-radius: 100% 0 50% 50%;
            transform: rotate(-8deg);
            z-index: 1;
            border: 1px solid #0a5c1f;
        }

        .petal-front-right {
            position: absolute;
            bottom: 0;
            right: -18px;
            width: 52px;
            height: 88px;
            background: #3ca55c;
            border-radius: 0 100% 50% 50%;
            transform: rotate(8deg);
            z-index: 1;
            border: 1px solid #0a5c1f;
        }

        .petal-center {
            position: relative;
            width: 50px;
            height: 90px;
            background: #4db86e;
            border-radius: 50% 50% 45% 45%;
            border: 1px solid #0a5c1f;
        }

        .petal-center::before {
            content: '✨';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
        }

        /* Leaves */
        .leaf {
            position: absolute;
            width: 55px;
            height: 32px;
            background: #3a9a2e;
            border-radius: 0 100% 0 100%;
            border: 1px solid #1e5a18;
        }

        .leaf-left {
            left: -45px;
            top: 160px;
            transform: rotate(-35deg);
        }

        .leaf-right {
            right: -45px;
            top: 90px;
            transform: rotate(35deg);
        }

        .leaf-left-lower {
            left: -35px;
            top: 240px;
            width: 45px;
            height: 26px;
            transform: rotate(-20deg);
        }

        .leaf-right-lower {
            right: -35px;
            top: 210px;
            width: 45px;
            height: 26px;
            transform: rotate(25deg);
        }

        /* Text */
        .gift-text {
            color: #F4C542;
            font-family: 'Brush Script MT', cursive;
            font-size: 3rem;
            text-shadow: 3px 3px 12px rgba(0,0,0,0.6);
            margin: 30px 0 20px;
            text-align: center;
        }

        .back-link {
            color: rgba(244, 197, 66, 0.8);
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 30px;
            background: rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(244, 197, 66, 0.4);
            color: white;
        }

        /* Heart trail */
        .heart-trail {
            position: absolute;
            pointer-events: none;
            font-size: 1.2rem;
            animation: floatUp 1.6s forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0.5);
                opacity: 0;
            }
        }

        /* Debug panel - shows if CSS is loading */
        .debug {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: black;
            color: lime;
            padding: 5px 10px;
            font-size: 11px;
            font-family: monospace;
            z-index: 9999;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="flower-container">
        <div class="tulip-wrapper">
            <div class="head">
                <div class="petal-back-left"></div>
                <div class="petal-back-right"></div>
                <div class="petal-front-left"></div>
                <div class="petal-front-right"></div>
                <div class="petal-center"></div>
            </div>
            <div class="stem">
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
                <div class="leaf leaf-left-lower"></div>
                <div class="leaf leaf-right-lower"></div>
            </div>
        </div>
        
        <h2 class="gift-text">🫶 An Emerald Tulip for Ninin 🫶</h2>
        <a href="ninin1.html" class="back-link">← Back to the Pictures</a>
    </div>

    <div class="debug" id="debug">Loading...</div>

    <script>
        // Debug info
        const debug = document.getElementById('debug');
        debug.textContent = 'CSS Loaded - Tulip should be visible';
        
        // Log to console
        console.log('Page loaded - tulip should be visible immediately');
        console.log('Screen size:', window.innerWidth, 'x', window.innerHeight);
        
        // Check if elements exist
        const tulip = document.querySelector('.head');
        const stem = document.querySelector('.stem');
        console.log('Tulip head found:', !!tulip);
        console.log('Stem found:', !!stem);
        
        if (tulip) {
            const rect = tulip.getBoundingClientRect();
            console.log('Tulip position:', rect);
        }
        
        // Heart trail
        const emojis = ['💚', '🌷', '✨', '💛', '🫶'];
        
        document.addEventListener('mousemove', (e) => {
            const trail = document.createElement('div');
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            trail.innerHTML = randomEmoji;
            trail.className = 'heart-trail';
            trail.style.left = e.pageX + 'px';
            trail.style.top = e.pageY + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 1600);
        });
        
        // Change debug after 3 seconds
        setTimeout(() => {
            debug.textContent = 'Tulip should be visible. If not, check console (F12)';
            debug.style.background = 'orange';
            debug.style.color = 'black';
        }, 3000);
    </script>
</body>
</html>
